name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # @needleye/shared is a git dependency (see package.json). If
      # needleye-shared is a private repo, this install step needs
      # credentials -- either make needleye-shared public, or configure a
      # deploy key / PAT here (e.g. via `git config --global url."https://<token>@github.com/".insteadOf "https://github.com/"`
      # using a secrets.SHARED_REPO_TOKEN before `npm install`).
      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          # Build-time placeholders -- Vercel (or wherever this deploys)
          # supplies the real values as project env vars. Present here only
          # so `next build`'s static analysis/prerendering doesn't fail.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_API_BASE_URL: https://placeholder.example.com/api/v1
        run: npm run build

      # Deploy step goes here once a hosting target is chosen (Vercel is
      # the natural fit and has its own Git-integration deploy flow that
      # may make this job's build step redundant -- keep whichever one
      # actually gates merges).
